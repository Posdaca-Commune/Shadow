name: Build Linux

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:

  build:
    strategy:
      matrix:
        configuration: [Debug, Release]
        runtime: [linux-x64, linux-arm64]

    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # 项目目标框架为 net10.0
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore & build solution
      run: dotnet build Shadow.slnx --configuration $env:Configuration
      env:
        Configuration: ${{ matrix.configuration }}

    # 调用项目自带的打包脚本生成 tar.gz（AppImage 可选，需 appimagetool）。
    - name: Build & package Linux
      run: pwsh scripts/build-linux.ps1 -Configuration $env:Configuration -Runtime $env:Runtime
      env:
        Configuration: ${{ matrix.configuration }}
        Runtime: ${{ matrix.runtime }}

    - name: Upload Linux artifact
      uses: actions/upload-artifact@v4
      with:
        name: Linux-${{ matrix.runtime }}-${{ matrix.configuration }}
        path: artifacts/linux
        if-no-files-found: error
